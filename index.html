<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор калорий</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Калькулятор калорий</h1>
    <p class="subtitle">Узнайте свою суточную норму калорий</p>

    <form id="calc-form">
      <div class="field">
        <span class="label">Пол</span>
        <div class="segmented" role="radiogroup" aria-label="Пол">
          <label class="segment">
            <input type="radio" name="gender" value="male" checked>
            <span>Мужской</span>
          </label>
          <label class="segment">
            <input type="radio" name="gender" value="female">
            <span>Женский</span>
          </label>
        </div>
      </div>

      <div class="grid">
        <div class="field">
          <label for="age">Возраст, лет</label>
          <input type="number" id="age" min="10" max="100" value="30" required>
        </div>
        <div class="field">
          <label for="weight">Вес, кг</label>
          <input type="number" id="weight" min="30" max="300" step="0.1" value="70" required>
        </div>
        <div class="field">
          <label for="height">Рост, см</label>
          <input type="number" id="height" min="100" max="250" value="175" required>
        </div>
      </div>

      <div class="field">
        <label for="activity">Уровень активности</label>
        <select id="activity">
          <option value="1.2">Минимальный (сидячая работа, без спорта)</option>
          <option value="1.375">Лёгкий (тренировки 1-3 раза в неделю)</option>
          <option value="1.55" selected>Средний (тренировки 3-5 раз в неделю)</option>
          <option value="1.725">Высокий (тренировки 6-7 раз в неделю)</option>
          <option value="1.9">Очень высокий (физическая работа + тренировки)</option>
        </select>
      </div>

      <div class="field">
        <span class="label">Цель</span>
        <div class="segmented" role="radiogroup" aria-label="Цель">
          <label class="segment">
            <input type="radio" name="goal" value="lose">
            <span>Похудение</span>
          </label>
          <label class="segment">
            <input type="radio" name="goal" value="maintain" checked>
            <span>Поддержание</span>
          </label>
          <label class="segment">
            <input type="radio" name="goal" value="gain">
            <span>Набор массы</span>
          </label>
        </div>
      </div>

      <button type="submit">Рассчитать</button>
    </form>

    <section id="result" class="result" hidden>
      <div class="result-item">
        <span class="result-label">Базовый обмен веществ (BMR)</span>
        <span class="result-value" id="bmr-value">-</span>
      </div>
      <div class="result-item">
        <span class="result-label">Расход калорий в день (TDEE)</span>
        <span class="result-value" id="tdee-value">-</span>
      </div>
      <div class="result-item highlight">
        <span class="result-label" id="goal-label">Норма калорий для цели</span>
        <span class="result-value" id="goal-value">-</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
